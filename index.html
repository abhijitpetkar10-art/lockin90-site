<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b10"><meta name="description" content="Your personal 90-day discipline command centre"><link rel="manifest" href="manifest.json"><title>LOCKIN 90 — Command centre</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="app"><aside class="sidebar"><a class="brand" href="#home"><span class="brand-mark">L</span><span>LOCKIN <b>90</b><small>PERSONAL COMMAND CENTRE</small></span></a><nav><button class="nav active" data-page="home"><i>◫</i> Overview</button><button class="nav" data-page="schedule"><i>☷</i> Daily schedule</button><button class="nav" data-page="challenge"><i>◷</i> challenge</button><button class="nav" data-page="review"><i>✳</i> Daily review</button><button class="nav" data-page="settings"><i>⚙</i> Settings</button></nav><div class="side-bottom"><div class="side-day"><span class="live-dot"></span> YOUR CHALLENGE <strong id="sideDay">DAY 01 / 30</strong><div class="mini-track"><i id="sideTrack"></i></div></div><div class="local-note">◉ &nbsp;SAVED ON THIS DEVICE</div></div></aside><main><header class="topbar"><div class="crumb">COMMAND CENTRE <span>/</span> <b id="crumb">OVERVIEW</b></div><div class="top-right"><span class="local-badge"><i></i> LOCAL TIME</span><div class="avatar">A</div></div></header><div id="page" class="content"></div></main></div><div class="toast" id="toast"></div><dialog id="taskDialog"><form method="dialog" id="taskForm"><div class="dialog-head"><div><small>TIMETABLE</small><h2 id="dialogTitle">Add a task</h2></div><button class="icon-btn" value="cancel">×</button></div><input type="hidden" id="taskId"><label>Task name<input id="taskName" required maxlength="70" placeholder="e.g. Focused study"></label><div class="form-row"><label>Start<input id="taskStart" type="time" required></label><label>End<input id="taskEnd" type="time" required></label></div><label>Reminder message<input id="taskMessage" maxlength="120" placeholder="Time to begin this block."></label><label class="checkline"><input id="taskEnabled" type="checkbox" checked> Include in this schedule</label><div class="dialog-actions"><button type="button" class="btn quiet" id="deleteTask" hidden>Delete</button><button class="btn primary" value="save">Save task</button></div></form></dialog><dialog id="skipDialog"><form method="dialog" id="skipForm"><div class="dialog-head"><div><small>DAILY SCHEDULE</small><h2>Skip this task</h2></div><button class="icon-btn" value="cancel">×</button></div><label>Reason<input id="skipReason" placeholder="Why are you skipping?" maxlength="120"></label><div class="dialog-actions"><button class="btn quiet" value="cancel">Cancel</button><button class="btn primary" value="save">Confirm skip</button></div></form></dialog><script src="app.js"></script></body></html>
